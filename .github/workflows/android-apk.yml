name: Build Android APK

# 只在手动触发与 main 分支推送时运行。
#
# 刻意不挂 pull_request：这个 workflow 会用仓库签名密钥出包，
# 若允许外部 PR 触发，等于把密钥交给不可信代码（PR 可以改写构建脚本把密钥外传）。
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 构建成功后创建/更新 GitHub Release
        type: boolean
        default: true
      notes:
        description: 更新说明（写入 update.json 的 notes；留空用默认文案）
        type: string
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  # 现役签名证书 SHA-256。必须与已发布版本的签名一致，否则老用户无法覆盖升级
  # （Android 会以 INSTALL_FAILED_UPDATE_INCOMPATIBLE 拒绝安装）。
  # 换钥匙时这里要同步更新，并接受「老用户必须卸载重装」的后果。
  EXPECTED_CERT_SHA256: b23d08d3e4e21b051ecc09e8277b669d8b6090d686ef9b5d47d090e6affb079d

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 多个包必须用空格分隔。
          # 用 YAML 的 `|` 写多行会被整体当成一个包名，
          # 报 "Failed to find package 'platforms;android-35\nbuild-tools;35.0.0'"。
          packages: "platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from app/build.gradle
        id: version
        run: |
          set -euo pipefail
          # 正则只用 BRE 标准语法（[0-9][0-9]* 而非 GNU 扩展的 [0-9]\+），
          # 这样在 GNU sed 与 BSD sed 上行为一致。
          NAME=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -n1)
          CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n1)
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::无法从 app/build.gradle 解析 versionName / versionCode"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "解析到 versionName=$NAME versionCode=$CODE"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JUKU_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::仓库缺少 secret JUKU_KEYSTORE_BASE64，无法签名出包"
            exit 1
          fi
          KS="$RUNNER_TEMP/juku-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          echo "keystore 大小: $(wc -c < "$KS") bytes"
          echo "JUKU_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          JUKU_KEYSTORE_PASSWORD: ${{ secrets.JUKU_KEYSTORE_PASSWORD }}
          JUKU_KEY_ALIAS: ${{ secrets.JUKU_KEY_ALIAS }}
          JUKU_KEY_PASSWORD: ${{ secrets.JUKU_KEY_PASSWORD }}
        run: |
          # 防御：在 Windows 上提交时 gradlew 容易丢失可执行位，
          # Linux 检出后直接执行会以 126 (Permission denied) 失败。
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect and verify APK
        id: apk
        run: |
          set -euo pipefail

          SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*unsigned*' | head -n1)
          if [ -z "$SRC" ]; then
            echo "::error::没有找到 release APK"
            find app/build/outputs -type f | head -50
            exit 1
          fi

          mkdir -p artifacts
          APK="artifacts/juku-mobile-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$APK"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          APKSIGNER="$BUILD_TOOLS/apksigner"

          echo "== apksigner verify =="
          VERIFY_OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)
          printf '%s\n' "$VERIFY_OUT"

          # 提取证书 SHA-256。刻意不匹配固定的行首前缀，因为不同 build-tools
          # 版本的输出格式不同：
          #   旧: "Signer #1 certificate SHA-256 digest: <hex>"
          #   新: "V3.0 Signer: certificate SHA-256 digest: <hex>"
          # 用 "certificate SHA-256 digest:" 定位可同时兼容两者，
          # 且不会误取到 "public key SHA-256 digest:" 那一行。
          CERT=$(printf '%s\n' "$VERIFY_OUT" \
                   | grep -oE 'certificate SHA-256 digest: [0-9a-fA-F]{64}' \
                   | head -n1 | awk '{print $NF}' | tr 'A-F' 'a-f' || true)
          EXPECTED_LOWER=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f')

          if [ "$CERT" != "$EXPECTED_LOWER" ]; then
            echo "::error::签名证书与现役证书不一致，产物会让老用户无法覆盖升级"
            echo "  期望: $EXPECTED_LOWER"
            echo "  实际: ${CERT:-<未能从 apksigner 输出中解析出证书>}"
            exit 1
          fi
          echo "签名证书校验通过: $CERT"

          SIZE=$(wc -c < "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1 | tr 'a-f' 'A-F')
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256=$SHA" >> "$GITHUB_ENV"

          {
            echo "### Android APK 构建成功"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 文件 | \`juku-mobile-${{ steps.version.outputs.name }}.apk\` |"
            echo "| versionCode | \`${{ steps.version.outputs.code }}\` |"
            echo "| versionName | \`${{ steps.version.outputs.name }}\` |"
            echo "| 大小 | \`$SIZE\` bytes |"
            echo "| sha256 | \`$SHA\` |"
            echo "| 签名证书 SHA-256 | \`$CERT\` |"
            echo ""
            echo "> 下载后用 \`adb install -r\` 或手机浏览器安装。"
            echo "> 服务端 \`api/mobile/update\` 若要推送此版本，需同步 \`versionCode / versionName / sha256 / size\`。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate server update.json
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          # AGP 产出的 APK 不可复现（zip 条目时间戳随构建时间变化，
          # 实测设 SOURCE_DATE_EPOCH 也无效），所以 sha256 每次构建都不同。
          # 结论：这个值绝不能手工抄写，必须由流水线自己生成。
          NOTES="$NOTES_INPUT"
          if [ -z "$NOTES" ]; then
            NOTES="本次更新包含功能优化和问题修复。"
          fi
          PUBLISHED=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # 结构对齐服务端 /data/mobile/update.json，apkName 直接用服务端约定名，
          # 因此这份文件可以整份替换过去，不需要手工改任何字段。
          # 用 python 生成以免 notes 里的引号/换行破坏 JSON；单行 -c 规避 YAML 缩进。
          python3 -c "import json,sys;print(json.dumps({'versionCode':int(sys.argv[1]),'versionName':sys.argv[2],'sha256':sys.argv[3],'size':int(sys.argv[4]),'notes':sys.argv[5],'publishedAt':sys.argv[6],'apkName':'juku-mobile.apk'},ensure_ascii=False,indent=2))" \
            "$VERSION_CODE" "$VERSION_NAME" "$APK_SHA256" "$APK_SIZE" "$NOTES" "$PUBLISHED" \
            > artifacts/update.json

          echo "--- artifacts/update.json ---"
          cat artifacts/update.json

          {
            echo ""
            echo "#### 服务端 update.json"
            echo ""
            echo "可直接整份替换服务端 \`/data/mobile/update.json\`（apkName 已按服务端约定写好）："
            echo ""
            echo '```json'
            cat artifacts/update.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: juku-mobile-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: |
            artifacts/*.apk
            artifacts/update.json
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          APK="artifacts/juku-mobile-${VERSION_NAME}.apk"

          # 注意：这里刻意不用 heredoc —— 在 YAML 的 run 块里 heredoc 会保留
          # 缩进空格，导致 markdown 表格被解析成代码块。
          printf '%s\n' \
            "Android 客户端 **${VERSION_NAME}**（versionCode ${VERSION_CODE}）。" \
            "" \
            "| 项 | 值 |" \
            "|---|---|" \
            "| 文件 | \`juku-mobile-${VERSION_NAME}.apk\` |" \
            "| 大小 | \`${APK_SIZE}\` bytes |" \
            "| sha256 | \`${APK_SHA256}\` |" \
            "| 签名证书 | \`${EXPECTED_CERT_SHA256}\` |" \
            "" \
            "安装：手机浏览器直接下载安装，或 \`adb install -r juku-mobile-${VERSION_NAME}.apk\`。" \
            "" \
            "**附件 \`update.json\` 可直接替换服务端 \`/data/mobile/update.json\`** —— sha256/size 由本次构建产出，无需手工填写。" \
            "" \
            "> 本包与历史版本同一签名，已安装用户可直接覆盖升级。" \
            > "$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传产物"
            gh release upload "$TAG" "$APK" artifacts/update.json --clobber
          else
            gh release create "$TAG" "$APK" artifacts/update.json \
              --title "果果剧库 ${VERSION_NAME}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi

      - name: Job summary
        if: always()
        run: |
          echo "产物路径：artifacts/juku-mobile-${{ steps.version.outputs.name }}.apk" >> "$GITHUB_STEP_SUMMARY"
