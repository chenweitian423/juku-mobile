plugins {
    id "com.android.application"
}

// 签名凭据来源优先级：环境变量 > gradle -P 属性。
// 两者都缺省时不启用签名，产出未签名 release 包（仅供本地调试），
// 这样在没配钥匙的机器上也能正常构建。
//
// CI 侧需要的环境变量（与 GitHub Secrets 一一对应）：
//   JUKU_KEYSTORE           钥匙文件路径（CI 里先 base64 解码到临时目录）
//   JUKU_KEYSTORE_PASSWORD  仓库口令
//   JUKU_KEY_ALIAS          密钥别名
//   JUKU_KEY_PASSWORD       密钥口令
def jukuStoreFile = System.getenv("JUKU_KEYSTORE") ?: project.findProperty("juku.keystore")
def jukuStorePassword = System.getenv("JUKU_KEYSTORE_PASSWORD") ?: project.findProperty("juku.keystore.password")
def jukuKeyAlias = System.getenv("JUKU_KEY_ALIAS") ?: project.findProperty("juku.key.alias")
def jukuKeyPassword = System.getenv("JUKU_KEY_PASSWORD") ?: project.findProperty("juku.key.password")
def jukuSigningReady = jukuStoreFile && jukuStorePassword && jukuKeyAlias && jukuKeyPassword

android {
    namespace "com.juku.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.juku.mobile"
        minSdk 23
        targetSdk 35
        versionCode 15
        versionName "1.3.6"
    }

    signingConfigs {
        if (jukuSigningReady) {
            release {
                storeFile file(jukuStoreFile)
                storePassword jukuStorePassword
                keyAlias jukuKeyAlias
                keyPassword jukuKeyPassword
                // 现役钥匙是 PKCS12 格式（扩展名沿用 .jks），必须显式声明，
                // 否则 AGP 会按 JKS 解析并报 "Keystore was tampered with"。
                storeType "PKCS12"
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (jukuSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
