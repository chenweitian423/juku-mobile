# 本文件是 iOS 工程的唯一事实来源：project.pbxproj 由 XcodeGen 从它生成，
# 不纳入版本控制（避免工程文件产生无意义 diff 与合并冲突）。
#
# 本地需要 Xcode 时：
#   brew install xcodegen && cd ios && xcodegen generate && open JukuMobile.xcodeproj
#
# 版本号与 Android 端 app/build.gradle 保持同步：
#   MARKETING_VERSION       <-> versionName
#   CURRENT_PROJECT_VERSION <-> versionCode

name: JukuMobile

options:
  bundleIdPrefix: com.juku
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.3.16"
    CURRENT_PROJECT_VERSION: "25"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # 未签名构建：CI 用 CODE_SIGNING_ALLOWED=NO 出包，供 sideload 场景使用。
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  JukuMobile:
    type: application
    platform: iOS
    sources:
      - path: JukuMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juku.mobile
        PRODUCT_NAME: JukuMobile
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: JukuMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        ENABLE_BITCODE: "NO"
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: JukuMobile/Info.plist
      properties:
        CFBundleDisplayName: 果果剧库
        CFBundleName: JukuMobile
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - armv7
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        # 交给 RootViewController 控制：播放器沉浸时隐藏状态栏（prefersStatusBarHidden）。
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # 与 Android 端 usesCleartextTraffic / network_security_config 对齐：
        # 允许 http 明文与自签 https 证书，否则内网服务器（如 192.168.x.x:8999）无法加载。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSPhotoLibraryUsageDescription: 用于在剧库网页中选择并上传图片。
        NSCameraUsageDescription: 用于在剧库网页中拍摄并上传图片。
        NSMicrophoneUsageDescription: 用于在剧库网页中录制并上传音频。
        NSLocalNetworkUsageDescription: 用于连接局域网内的剧库服务器。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
